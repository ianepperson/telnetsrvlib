[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telnetsrv"
version = "1.0.1"
description = "Telnet server handler library"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Ian Epperson", email = "ian@epperson.com"},
]
keywords = ["gevent", "telnet", "server"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Library or Lesser General Public License (LGPL)",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
    "Topic :: Communications :: BBS",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
    "Topic :: Terminals :: Telnet",
]

[project.urls]
Homepage = "https://github.com/ianepperson/telnetsrvlib"

[project.optional-dependencies]
green = ["gevent"]
ssh = ["paramiko", "cryptography>=48.0.1"]
dev = [
    "black>=26.3.1",
    "flake8>=7.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["telnetsrv"]

[tool.hatch.build.targets.sdist]
include = [
    "telnetsrv/",
    "README.md",
    "COPYING.txt",
]

[project.scripts]
lint = "telnetsrv._lint:main"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["tests", "example-test.py"]
python_files = ["test_*.py", "*_test.py", "*-test.py"]
addopts = "--tb=short -q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["telnetsrv"]
branch = true
omit = [
    "telnetsrv/green.py",
    "telnetsrv/evtlet.py",
    "telnetsrv/paramiko_ssh.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
